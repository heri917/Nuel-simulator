<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuel Simulator">
<link rel="apple-touch-icon" href="./nuel-logo.jpeg">
<link rel="manifest" href="./manifest.json">
<title>Nuel Simulator</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;font-family:Arial,Helvetica,sans-serif;touch-action:none}
button{font:inherit;color:inherit;border:0;outline:0;appearance:none;-webkit-appearance:none}
#game{position:fixed;inset:0;background:#0b0d0f}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:
 radial-gradient(circle at 50% 38%,#252a2d 0,#111417 38%,#080a0c 78%);
 transition:opacity .55s ease,visibility .55s ease}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.loadWrap{width:min(760px,88vw);text-align:center}
.loadLogo{width:min(430px,58vw);max-height:30vh;height:auto;aspect-ratio:auto;object-fit:contain;border-radius:18px;display:block;margin:0 auto 22px;box-shadow:0 18px 70px rgba(0,0,0,.65),0 0 0 2px rgba(255,198,30,.25)}
.loadTitle{font-weight:900;letter-spacing:5px;font-size:clamp(18px,3vw,30px);margin-bottom:5px}
.loadSub{font-size:12px;letter-spacing:3px;color:#9ba2a6;margin-bottom:22px}
.loaderTrack{position:relative;height:34px;border:2px solid #34393d;border-radius:18px;background:#111416;overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
.loaderFill{position:absolute;left:0;top:0;height:100%;width:0;background:repeating-linear-gradient(135deg,#f6c21a 0 16px,#111416 16px 28px);transition:width .12s linear}
.tire{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle,#777 0 16%,#222 17% 36%,#0a0a0a 37% 66%,#555 67% 72%,#0b0b0b 73%);border:2px solid #0a0a0a;box-shadow:0 4px 10px rgba(0,0,0,.65);z-index:3}
.tire:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px dashed #777}
.loadPct{margin-top:11px;font-size:18px;font-weight:900;color:#f6c21a;letter-spacing:2px}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
.panel{position:absolute;background:rgba(9,11,13,.78);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 35px rgba(0,0,0,.25);backdrop-filter:blur(8px);border-radius:17px}
#brand{left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));padding:12px 17px}
#brand b{font-size:clamp(16px,2.2vw,25px);letter-spacing:1px}
#brand small{display:block;color:#b9bec2;margin-top:4px;letter-spacing:1px}
#speed{right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));padding:11px 18px;text-align:right;min-width:108px}
#speed .n{font-size:clamp(26px,4vw,43px);font-weight:900;line-height:.9}
#speed .u{font-size:11px;color:#aeb4b8;letter-spacing:2px}
#rpmBox{right:max(14px,env(safe-area-inset-right));top:94px;padding:9px 14px;min-width:150px}
#rpmLabel{font-size:10px;color:#aeb4b8;letter-spacing:2px}
#rpmBar{height:7px;margin-top:6px;border-radius:5px;background:#252a2e;overflow:hidden}
#rpmFill{height:100%;width:0;background:linear-gradient(90deg,#9aa0a4,#f0c329,#e45b35)}
#map{left:max(14px,env(safe-area-inset-left));bottom:max(15px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;overflow:hidden;background:rgba(12,15,17,.82);border:2px solid rgba(255,255,255,.25);box-shadow:0 8px 25px rgba(0,0,0,.4)}
#mapCanvas{width:100%;height:100%}
#controls{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(15px,env(safe-area-inset-bottom));display:flex;align-items:end;gap:10px;pointer-events:auto}
.ctrl{width:74px;height:74px;border-radius:20px;background:rgba(15,18,20,.88);border:1px solid rgba(255,255,255,.18);box-shadow:0 7px 18px rgba(0,0,0,.32);display:grid;place-items:center;font-weight:900;touch-action:none}
.ctrl.gas{height:110px;background:rgba(42,36,14,.94);border-color:rgba(246,194,26,.5)}
.ctrl.brake{height:92px}
.ctrl.dump{background:rgba(25,47,32,.94);border-color:rgba(126,183,135,.45)}
.ctrl.reset{background:rgba(55,24,24,.94)}
.ctrl .sym{font-size:29px;line-height:1}
.ctrl small{font-size:11px;letter-spacing:1px}
.ctrl.active{transform:scale(.97);filter:brightness(1.22)}
#steer{position:absolute;left:max(155px,18vw);bottom:max(22px,env(safe-area-inset-bottom));width:170px;height:74px;display:flex;gap:10px;pointer-events:auto}
.steer{flex:1;height:74px;border-radius:22px;background:rgba(15,18,20,.86);border:1px solid rgba(255,255,255,.17);font-size:31px;font-weight:900;touch-action:none}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 18px;border-radius:15px;background:rgba(9,11,13,.7);color:#e7e9ea;font-size:14px;opacity:.85;transition:opacity .5s}
#dumpState{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:150px;padding:8px 12px;border-radius:12px;background:rgba(9,11,13,.65);font-size:11px;letter-spacing:1px;color:#c9ced1;display:none}
@media (max-width:760px) and (orientation:landscape){
 #brand{padding:9px 13px}.ctrl{width:65px;height:65px}.ctrl.gas{height:94px}.ctrl.brake{height:78px}.ctrl.dump,.ctrl.reset{height:65px}
 #steer{left:145px;width:150px;height:65px}.steer{height:65px}
 #map{width:105px;height:105px}
 #rpmBox{top:83px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="loading">
  <div class="loadWrap">
    <img class="loadLogo" src="./nuel-logo.jpeg" alt="Nuel Simulator">
    <div class="loadTitle">NUEL SIMULATOR</div>
    <div class="loadSub">VOLVO FMX 440 • TRINTON 8×4 • DT030-0204</div>
    <div class="loaderTrack">
      <div id="loaderFill" class="loaderFill"></div>
      <div id="tire" class="tire"></div>
    </div>
    <div id="loadPct" class="loadPct">0%</div>
  </div>
</div>


<div id="hud">
  <div id="brand" class="panel"><b>NUEL SIMULATOR</b><small>DT030-0204 • HAUL ROAD</small></div>
  <div id="speed" class="panel"><div class="n" id="speedN">0</div><div class="u">KM/H</div></div>
  <div id="rpmBox" class="panel"><div id="rpmLabel">RPM ×100</div><div id="rpmBar"><div id="rpmFill"></div></div></div>
  <div id="hint">Seret layar untuk melihat sekitar • kamera mengikuti arah truk</div>
  <div id="dumpState">DUMP BODY • LOWERED</div>
  <div id="map"><canvas id="mapCanvas" width="260" height="260"></canvas></div>
  <div id="steer">
    <button id="left" class="steer" type="button" aria-label="Belok kiri">◀</button>
    <button id="right" class="steer" type="button" aria-label="Belok kanan">▶</button>
  </div>
  <div id="controls">
    <button id="brake" class="ctrl brake" type="button" aria-label="Rem"><div><div class="sym">▾</div><small>REM</small></div></button>
    <button id="gas" class="ctrl gas" type="button" aria-label="Gas"><div><div class="sym">▲</div><small>GAS</small></div></button>
    <button id="dump" class="ctrl dump" type="button" aria-label="Dump"><div><div class="sym">↥</div><small>DUMP</small></div></button>
    <button id="reset" class="ctrl reset" type="button" aria-label="Reset"><div><div class="sym">↻</div><small>RESET</small></div></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const loading = $("loading"), fill=$("loaderFill"), tire=$("tire"), pct=$("loadPct");

let loadStart=performance.now();
function animateLoading(now){
  const p=clamp((now-loadStart)/10000,0,1);
  fill.style.width=(p*100)+"%";
  tire.style.left=(p*100)+"%";
  tire.style.transform=`rotate(${p*1450}deg)`;
  pct.textContent=Math.round(p*100)+"%";
  if(p<1) requestAnimationFrame(animateLoading);
  else setTimeout(()=>loading.classList.add("hide"),180);
}
requestAnimationFrame(animateLoading);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ca8a0);
scene.fog = new THREE.Fog(0x9ca8a0, 150, 850);

const camera = new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1400);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
$("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe4ff,0x33402d,2.0));
const sun=new THREE.DirectionalLight(0xfff0d0,3.2);
sun.position.set(-180,260,120); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-300;sun.shadow.camera.right=300;sun.shadow.camera.top=300;sun.shadow.camera.bottom=-300;
scene.add(sun);

const world=new THREE.Group(); scene.add(world);

function mat(color,rough=.75,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
const mRoad=mat(0x4c4941,1), mShoulder=mat(0x5b5549,1), mDark=mat(0x1c1e1e,.9), mWhite=mat(0xe7e4d9,.8),
      mBlack=mat(0x171a1b,.72,.25), mBlue=mat(0x0b5b95,.62,.05), mYellow=mat(0xf2c218,.65,.05),
      mSteel=mat(0x74777a,.42,.72), mGlass=new THREE.MeshStandardMaterial({color:0x24333a,roughness:.15,metalness:.1,transparent:true,opacity:.72}),
      mGreen=mat(0x273d26,1), mSoil=mat(0x3d352c,1), mRock=mat(0x68635a,1);

function box(w,h,d,material,x=0,y=0,z=0, parent=world){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z); mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function cyl(r,h,material,x=0,y=0,z=0,rx=0,rz=0,parent=world){
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),material);
 mesh.position.set(x,y,z);mesh.rotation.x=rx;mesh.rotation.z=rz;mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}

const ROAD_W=15;
const pts=[];
for(let i=0;i<42;i++){
 const z=i*30-610;
 const x=Math.sin(i*.42)*34 + Math.sin(i*.17)*58;
 const y=4 + Math.sin(i*.27)*8 + Math.sin(i*.11)*5 + (i>24?(i-24)*.7:0);
 pts.push(new THREE.Vector3(x,y,z));
}
const roadCurve=new THREE.CatmullRomCurve3(pts,false,"centripetal",.55);
const samples=260;
const roadVerts=[],roadIdx=[];
for(let i=0;i<samples;i++){
 const t=i/(samples-1), p=roadCurve.getPoint(t), tan=roadCurve.getTangent(t).normalize();
 const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
 const half=ROAD_W*.5;
 roadVerts.push(p.x+side.x*half,p.y,p.z+side.z*half,p.x-side.x*half,p.y,p.z-side.z*half);
}
for(let i=0;i<samples-1;i++){const a=i*2;roadIdx.push(a,a+1,a+2,a+1,a+3,a+2);}
const rg=new THREE.BufferGeometry();
rg.setAttribute("position",new THREE.Float32BufferAttribute(roadVerts,3));rg.setIndex(roadIdx);rg.computeVertexNormals();
const road=new THREE.Mesh(rg,mRoad);road.receiveShadow=true;world.add(road);

// Gravel shoulders and continuous earth berms ("banwol").
for(let s=-1;s<=1;s+=2){
 const verts=[],idx=[];
 for(let i=0;i<samples;i++){
  const t=i/(samples-1),p=roadCurve.getPoint(t),tan=roadCurve.getTangent(t).normalize();
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  const inner=ROAD_W*.5+1.2, outer=ROAD_W*.5+5.5;
  const a=new THREE.Vector3(p.x+side.x*inner*s,p.y-.25,p.z+side.z*inner*s);
  const b=new THREE.Vector3(p.x+side.x*outer*s,p.y-1.2,p.z+side.z*outer*s);
  verts.push(a.x,a.y,a.z,b.x,b.y,b.z);
 }
 for(let i=0;i<samples-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();
 const sh=new THREE.Mesh(g,mShoulder);sh.receiveShadow=true;world.add(sh);
 // Berm blocks
 for(let i=5;i<samples-4;i+=6){
   const t=i/(samples-1),p=roadCurve.getPoint(t),tan=roadCurve.getTangent(t).normalize();
   const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
   const b=box(4.8,1.15,5.5,mSoil,p.x+side.x*(ROAD_W*.5+4.2)*s,p.y+.15,p.z+side.z*(ROAD_W*.5+4.2)*s);
   b.rotation.y=Math.atan2(tan.x,tan.z);
 }
}

// Gravel stones / rut markers.
for(let i=0;i<700;i++){
 const t=Math.random()*.98+.01,p=roadCurve.getPoint(t),tan=roadCurve.getTangent(t).normalize(),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
 const lateral=(Math.random()-.5)*(ROAD_W*.9);
 const stone=box(.18+Math.random()*.35,.08+Math.random()*.14,.18+Math.random()*.35,mRock,
   p.x+side.x*lateral,p.y+.05,p.z+side.z*lateral);
 stone.rotation.y=Math.random()*Math.PI; stone.rotation.x=Math.random()*.4;
}
// Tire rut stripes
const rutMat=mat(0x35332f,.98);
for(const off of [-3.4,3.4]){
 const rv=[],ri=[];
 for(let i=0;i<samples;i++){
  const t=i/(samples-1),p=roadCurve.getPoint(t),tan=roadCurve.getTangent(t).normalize(),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  rv.push(p.x+side.x*off,p.y+.025,p.z+side.z*off);
 }
 for(let i=0;i<samples-1;i++){ri.push(i,i+1);}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(rv,3));g.setIndex(ri);
 const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x302e2a,transparent:true,opacity:.55}));world.add(line);
}

// Terrain
const terrainGeo=new THREE.PlaneGeometry(1400,1400,90,90);
const pos=terrainGeo.attributes.position;
for(let i=0;i<pos.count;i++){
 const x=pos.getX(i), z=pos.getY(i);
 pos.setZ(i, -2 + Math.sin(x*.013)*13 + Math.cos(z*.017)*11 + Math.sin((x+z)*.008)*17);
}
terrainGeo.rotateX(-Math.PI/2);terrainGeo.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeo,mGreen);terrain.receiveShadow=true;world.add(terrain);

// Trees
function makeTree(x,y,z,scale=1){
 const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(scale);
 const trunk=cyl(.42,5,mat(0x3a2b20,1),0,2.5,0);g.add(trunk);
 for(let j=0;j<4;j++){
   const cone=new THREE.Mesh(new THREE.ConeGeometry(3.4-j*.45,5.8,8),mat(j%2?0x1f3b20:0x274a26,1));
   cone.position.y=5.0+j*2.0;cone.castShadow=true;g.add(cone);
 }
 world.add(g);
}
for(let i=0;i<170;i++){
 const t=Math.random(),p=roadCurve.getPoint(t),tan=roadCurve.getTangent(t).normalize(),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
 const d=25+Math.random()*90, s=(Math.random()<.5?-1:1);
 const q=p.clone().add(side.multiplyScalar(d*s));
 makeTree(q.x,q.y-1,q.z,.65+Math.random()*1.1);
}

// Hills / rock mounds
for(let i=0;i<80;i++){
 const a=Math.random()*Math.PI*2,d=150+Math.random()*430;
 const x=Math.cos(a)*d,z=Math.sin(a)*d;
 const r=15+Math.random()*45,h=12+Math.random()*40;
 const rock=new THREE.Mesh(new THREE.ConeGeometry(r,h,9),mSoil);
 rock.position.set(x,-2+h/2,z);rock.rotation.y=Math.random()*Math.PI;rock.castShadow=true;rock.receiveShadow=true;world.add(rock);
}

// Disposal pad near the end.
const disposal=roadCurve.getPoint(.94).clone();
const pad=box(55,1.2,55,mat(0x514b42,1),disposal.x,disposal.y-.6,disposal.z);
pad.rotation.y=Math.atan2(roadCurve.getTangent(.94).x,roadCurve.getTangent(.94).z);
for(let i=0;i<10;i++){
 const mound=box(8+Math.random()*7,3+Math.random()*5,10+Math.random()*8,mSoil,
   disposal.x+(Math.random()-.5)*35,disposal.y+2,disposal.z+(Math.random()-.5)*30);
 mound.rotation.y=Math.random()*Math.PI;
}

// Truck
const truck=new THREE.Group();world.add(truck);
const visual=new THREE.Group();truck.add(visual);
const cab=new THREE.Group();visual.add(cab);
box(5.7,4.8,5.1,mWhite,0,5.0,2.3,cab);
box(5.45,2.0,5.25,mBlack,0,3.65,2.2,cab);
box(5.1,1.8,4.9,mGlass,0,5.85,2.15,cab);
box(5.65,.32,5.3,mBlack,0,3.0,2.15,cab);
box(5.9,.42,5.45,mBlack,0,2.45,2.15,cab);
box(5.5,.28,5.35,mYellow,0,3.12,2.15,cab);
box(5.1,.25,5.05,mBlue,0,3.32,2.15,cab);
box(5.1,.18,5.1,mYellow,0,3.48,2.15,cab);
for(const sx of [-2.55,2.55]){
 box(.28,2.2,.35,mBlack,sx,5.0,2.0,cab);
 box(.35,1.0,.22,mBlack,sx,5.85,0.25,cab);
}
box(5.8,.55,5.45,mBlack,0,1.95,2.15,cab);
box(4.7,.45,1.2,mBlack,0,2.15,-.55,cab);
for(const x of [-2.0,2.0]){
 box(.22,.55,1.2,mWhite,x,3.75,-.48,cab);
 box(.65,.25,.22,mYellow,x,3.65,-1.05,cab);
}
for(const x of [-2.55,2.55]){
 cyl(.13,.65,mBlack,x,7.7,2.0,0,0,cab);
 cyl(.15,.8,mYellow,x,8.05,2.0,0,0,cab);
}
for(const x of [-2.9,2.9]){
 box(.18,1.0,.22,mBlack,x,5.15,1.0,cab);
 cyl(.13,.7,mBlack,x,5.25,.7,Math.PI/2,0,cab);
}
const chassis=box(5.3,.65,12.2,mBlack,0,2.25,-3.2,visual);

// AlamTri side logo planes
const texLoader=new THREE.TextureLoader();
texLoader.load("./alamtri.webp",tex=>{
 tex.colorSpace=THREE.SRGBColorSpace;
 for(const side of [-1,1]){
   const pm=new THREE.MeshBasicMaterial({map:tex,transparent:true});
   const plane=new THREE.Mesh(new THREE.PlaneGeometry(3.9,1.15),pm);
   plane.position.set(side*2.72,4.85,-4.2);
   plane.rotation.y=side>0?-Math.PI/2:Math.PI/2;
   visual.add(plane);
 }
});

// Dump body with hinge animation
const dumpPivot=new THREE.Group();dumpPivot.position.set(0,3.0,-4.8);visual.add(dumpPivot);
const dump=box(5.7,4.7,8.8,mWhite,0,2.4,-.1,dumpPivot);
box(5.75,.22,8.95,mBlue,0,.55,-.15,dumpPivot);
box(5.78,.20,8.95,mYellow,0,.84,-.15,dumpPivot);
box(5.75,.24,8.95,mBlack,0,4.75,-.15,dumpPivot);
box(5.8,.25,.35,mBlack,0,4.7,4.0,dumpPivot);
box(5.8,.25,.35,mBlack,0,4.7,-4.1,dumpPivot);
const payload=box(5.0,1.1,7.7,mat(0x30291f,1),0,5.1,-.1,dumpPivot);
payload.visible=true;

// Front grille details
for(let y=2.65;y<3.35;y+=.22) box(3.9,.08,.14,mSteel,0,y,-.46,cab);
for(const x of [-1.95,1.95]) box(.95,1.25,.18,mGlass,x,2.75,-.62,cab);

// Wheel construction
const wheelTire=mat(0x111212,1), wheelHub=mat(0x8a8c8d,.38,.75);
const wheelSets=[];
function makeWheel(x,y,z,steerable=false){
 const g=new THREE.Group();g.position.set(x,y,z);
 const tireMesh=new THREE.Mesh(new THREE.CylinderGeometry(.98,.98,.54,24),wheelTire);
 tireMesh.rotation.z=Math.PI/2;tireMesh.castShadow=true;tireMesh.receiveShadow=true;g.add(tireMesh);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.58,20),wheelHub);
 hub.rotation.z=Math.PI/2;hub.castShadow=true;g.add(hub);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.07,8,20),wheelHub);
 ring.rotation.y=Math.PI/2;g.add(ring);
 if(steerable) g.userData.steer=true;
 visual.add(g);wheelSets.push(g);return g;
}
const axleZ=[.25,-2.0,-4.85,-7.55];
for(let i=0;i<4;i++){
 const z=axleZ[i];
 if(i<2){
   makeWheel(-2.55,1.35,z,true);makeWheel(2.55,1.35,z,true);
 }else{
   for(const x of [-2.62,-2.0,2.0,2.62]) makeWheel(x,1.35,z,false);
 }
}

// Mudguards
for(const z of axleZ) for(const x of [-2.72,2.72]){
 const f=new THREE.Mesh(new THREE.BoxGeometry(.35,1.2,2.15),mBlack);
 f.position.set(x,2.0,z);f.castShadow=true;visual.add(f);
}
// Hydraulic cylinders
const hydL=cyl(.16,3.7,mSteel,-1.55,3.7,-4.2,0,Math.PI/2,visual);
const hydR=cyl(.16,3.7,mSteel,1.55,3.7,-4.2,0,Math.PI/2,visual);

// Starting pose on road
const start=roadCurve.getPoint(.07);
truck.position.copy(start);
truck.position.y+=.3;
let startTan=roadCurve.getTangent(.07).normalize();
truck.rotation.y=Math.atan2(startTan.x,startTan.z);
let baseHeading=truck.rotation.y;

const state={speed:0,steer:0,gas:false,brake:false,dumping:false,dumpT:0,roll:0,camYaw:0,camPitch:0.22,camDist:30};
let targetCamYaw=0,targetCamPitch=.22,targetCamDist=30;
let manualCameraUntil=0;

function bindHold(id,key){
 const el=$(id);
 const down=e=>{e.preventDefault();state[key]=true;el.classList.add("active");el.setPointerCapture?.(e.pointerId)};
 const up=e=>{e.preventDefault();state[key]=false;el.classList.remove("active")};
 ["pointerdown"].forEach(t=>el.addEventListener(t,down,{passive:false}));
 ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,up,{passive:false}));
 el.addEventListener("contextmenu",e=>e.preventDefault());
 el.addEventListener("selectstart",e=>e.preventDefault());
}
bindHold("gas","gas");bindHold("brake","brake");bindHold("left","left");bindHold("right","right");

$("dump").addEventListener("pointerdown",e=>{e.preventDefault(); if(!state.dumping) {state.dumping=true;state.dumpT=0;}});
$("reset").addEventListener("pointerdown",e=>{e.preventDefault();resetTruck()});
for(const id of ["dump","reset"]){
 $(id).addEventListener("contextmenu",e=>e.preventDefault());
 $(id).addEventListener("selectstart",e=>e.preventDefault());
}
["selectstart","contextmenu","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest?.("#controls,#steer,#map"))e.preventDefault();},{passive:false}));

// Keyboard for desktop testing
addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")state.gas=true;
 if(e.key==="ArrowDown"||e.key==="s")state.brake=true;
 if(e.key==="ArrowLeft"||e.key==="a")state.left=true;
 if(e.key==="ArrowRight"||e.key==="d")state.right=true;
 if(e.key.toLowerCase()==="r")resetTruck();
 if(e.key.toLowerCase()==="e"&&!state.dumping){state.dumping=true;state.dumpT=0}
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key==="w")state.gas=false;
 if(e.key==="ArrowDown"||e.key==="s")state.brake=false;
 if(e.key==="ArrowLeft"||e.key==="a")state.left=false;
 if(e.key==="ArrowRight"||e.key==="d")state.right=false;
});

// Camera touch drag, with vertical movement reversed.
let camPointer=null,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.target.closest?.("#controls,#steer"))return;
 camPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId);
 manualCameraUntil=performance.now()+5500;
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(camPointer!==e.pointerId)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
 targetCamYaw-=dx*.006;
 targetCamPitch=clamp(targetCamPitch-dy*.004,-.05,.72); // vertical drag reversed
});
renderer.domElement.addEventListener("pointerup",e=>{if(camPointer===e.pointerId)camPointer=null});
renderer.domElement.addEventListener("pointercancel",e=>{if(camPointer===e.pointerId)camPointer=null});
let lastTouchDist=0;
renderer.domElement.addEventListener("touchmove",e=>{
 if(e.touches.length===2){
   const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
   const d=Math.hypot(dx,dy); if(lastTouchDist)targetCamDist=clamp(targetCamDist-(d-lastTouchDist)*.035,18,46); lastTouchDist=d;
   e.preventDefault();
 }
},{passive:false});
renderer.domElement.addEventListener("touchend",()=>{lastTouchDist=0},{passive:true});

function resetTruck(){
 const p=roadCurve.getPoint(.07);
 truck.position.copy(p);truck.position.y+=.3;
 const t=roadCurve.getTangent(.07).normalize();
 truck.rotation.y=Math.atan2(t.x,t.z);baseHeading=truck.rotation.y;
 state.speed=0;state.steer=0;state.roll=0;state.dumping=false;state.dumpT=0;
 dumpPivot.rotation.x=0;
 targetCamYaw=0;targetCamPitch=.22;targetCamDist=30;manualCameraUntil=0;
}

function roadInfo(pos){
 let best={d:Infinity,t:.07,p:roadCurve.getPoint(.07),tan:roadCurve.getTangent(.07)};
 for(let i=0;i<180;i++){
   const t=i/179,p=roadCurve.getPoint(t),d=p.distanceToSquared(pos);
   if(d<best.d)best={d,t,p,tan:roadCurve.getTangent(t).normalize()};
 }
 return best;
}

// Audio, created only after first game interaction to comply with iOS autoplay rules.
let audioCtx=null,osc=null,gain=null,filter=null;
function ensureAudio(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 osc=audioCtx.createOscillator();gain=audioCtx.createGain();filter=audioCtx.createBiquadFilter();
 osc.type="sawtooth";filter.type="lowpass";filter.frequency.value=420;
 osc.connect(filter).connect(gain).connect(audioCtx.destination);
 gain.gain.value=.0001;osc.start();
}
function updateAudio(){
 if(!audioCtx)return;
 if(audioCtx.state==="suspended")audioCtx.resume();
 const rpm=700+state.speed*38+(state.gas?520:0);
 osc.frequency.setTargetAtTime(42+rpm/5,audioCtx.currentTime,.04);
 filter.frequency.setTargetAtTime(250+rpm*.72,audioCtx.currentTime,.06);
 gain.gain.setTargetAtTime(.008+state.speed/900+(state.gas?.055:0),audioCtx.currentTime,.08);
}
["pointerdown","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,ensureAudio,{once:true,passive:true}));

let prev=performance.now();
function update(dt){
 const gas=state.gas,brake=state.brake;
 let info=roadInfo(truck.position);
 const slope=Math.max(-.25,Math.min(.25,info.tan.y));
 let accel=gas?4.9:0;
 if(brake)accel-=8.5;
 accel-=1.0+state.speed*.12;
 accel-=slope*7.0;
 state.speed=clamp(state.speed+accel*dt,0,30); // ~108 km/h absolute physics cap
 if(!gas&&state.speed<.15)state.speed=0;
 const steerInput=(state.left?-1:0)+(state.right?1:0);
 state.steer=lerp(state.steer,steerInput,.16);
 const speedFactor=clamp(state.speed/14,0,1);
 const turnRate=state.steer*.55*speedFactor;
 truck.rotation.y += turnRate*dt;
 // align chassis to road while preserving user steering.
 const ahead=truck.position.clone().add(new THREE.Vector3(Math.sin(truck.rotation.y),0,Math.cos(truck.rotation.y)).multiplyScalar(2.0));
 const follow=roadInfo(ahead);
 const lateral=follow.p.clone().sub(truck.position); lateral.y=0;
 const maxSide=ROAD_W*.42;
 if(lateral.length()>maxSide){
   lateral.setLength(Math.min(lateral.length()-maxSide,4));
   truck.position.add(lateral.multiplyScalar(Math.min(1,dt*2.8)));
 }
 // forward movement
 truck.position.x += Math.sin(truck.rotation.y)*state.speed*dt;
 truck.position.z += Math.cos(truck.rotation.y)*state.speed*dt;
 const info2=roadInfo(truck.position);
 truck.position.y=info2.p.y+.25;

 // Steering wheel visuals: only axles 1 and 2 steer.
 for(const w of wheelSets){
   if(w.userData.steer) w.rotation.y=state.steer*.45;
   // spin around axle
   w.children[0].rotation.x -= state.speed*dt*1.6;
 }
 // body pitch/roll
 const turnRoll=-state.steer*Math.min(.18,state.speed/55);
 state.roll=lerp(state.roll,turnRoll,.08);
 visual.rotation.z=state.roll;
 visual.rotation.x=lerp(visual.rotation.x,-slope*.16,.08);

 // Rollover physics: excessive speed + steering can overturn.
 const rollover=clamp((Math.abs(state.steer)*state.speed-7)/8,0,1);
 if(rollover>.02) visual.rotation.z=lerp(visual.rotation.z,state.steer*.62*rollover,.035);
 if(Math.abs(visual.rotation.z)>.78){
   state.speed*=.985;
   visual.rotation.z=lerp(visual.rotation.z,state.steer*.95,.02);
 }

 // Dump animation
 if(state.dumping){
   state.dumpT+=dt;
   const phase=clamp(state.dumpT/4.2,0,1);
   const up=phase<.55?phase/.55:(1-phase)/.45;
   dumpPivot.rotation.x=-THREE.MathUtils.degToRad(42)*up;
   $("dumpState").style.display="block";
   $("dumpState").textContent=up>.05?"DUMP BODY • RAISING":"DUMP BODY • LOWERED";
   if(phase>=1)state.dumping=false;
 } else {
   dumpPivot.rotation.x=lerp(dumpPivot.rotation.x,0,.08);
 }

 // Camera follows truck heading unless user is manually looking around.
 const now=performance.now();
 if(now>manualCameraUntil && camPointer===null){
   targetCamYaw=0;
 }
 state.camYaw=lerp(state.camYaw,targetCamYaw,.08);
 state.camPitch=lerp(state.camPitch,targetCamPitch,.08);
 state.camDist=lerp(state.camDist,targetCamDist,.08);

 const heading=truck.rotation.y+state.camYaw;
 const horiz=Math.cos(state.camPitch)*state.camDist;
 const camY=truck.position.y+7.2+Math.sin(state.camPitch)*state.camDist;
 const desired=new THREE.Vector3(
   truck.position.x-Math.sin(heading)*horiz,
   camY,
   truck.position.z-Math.cos(heading)*horiz
 );
 camera.position.lerp(desired,.12);
 const look=truck.position.clone().add(new THREE.Vector3(Math.sin(truck.rotation.y),1.4,Math.cos(truck.rotation.y)).multiplyScalar(13));
 look.y+=2.0;
 camera.lookAt(look);

 $("speedN").textContent=Math.round(state.speed*3.6);
 const rpm=clamp((700+state.speed*38+(gas?520:0)),700,2200);
 $("rpmFill").style.width=clamp((rpm-700)/1500*100,0,100)+"%";
 updateAudio();
 drawMap(info2.t);
}

function drawMap(t){
 const c=$("mapCanvas"),ctx=c.getContext("2d"),w=c.width,h=c.height;
 ctx.clearRect(0,0,w,h);
 ctx.fillStyle="#101315";ctx.fillRect(0,0,w,h);
 ctx.save();ctx.translate(w/2,h/2);
 const scale=3.1;
 ctx.strokeStyle="#77736a";ctx.lineWidth=9;ctx.lineCap="round";ctx.beginPath();
 for(let i=0;i<samples;i++){
   const p=roadCurve.getPoint(i/(samples-1));
   if(i===0)ctx.moveTo((p.x-roadCurve.getPoint(t).x)*scale,-(p.z-roadCurve.getPoint(t).z)*scale);
   else ctx.lineTo((p.x-roadCurve.getPoint(t).x)*scale,-(p.z-roadCurve.getPoint(t).z)*scale);
 }
 ctx.stroke();
 ctx.fillStyle="#f2c218";ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

function animate(){
 requestAnimationFrame(animate);
 const now=performance.now(),dt=Math.min((now-prev)/1000,.05);prev=now;
 update(dt);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
