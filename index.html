<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuel Simulator">
<link rel="apple-touch-icon" href="./nuel-logo.jpeg">
<link rel="manifest" href="./manifest.json">
<title>Nuel Simulator</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<script>document.documentElement.classList.toggle("force-landscape", window.innerWidth < window.innerHeight); window.addEventListener("resize",()=>document.documentElement.classList.toggle("force-landscape", window.innerWidth < window.innerHeight), {passive:true});</script>
<div id="stage">
<div id="game"></div>

<div id="loading">
  <div class="loadWrap">
    <img class="loadLogo" src="./nuel-logo.jpeg" alt="Nuel Simulator">
<div class="loaderTrack">
      <div id="loaderFill" class="loaderFill"></div>
      <div id="tire" class="tire"></div>
    </div>
    <div id="loadPct" class="loadPct">0%</div>
  </div>
</div>


<div id="hud">
<div id="speed" class="panel"><div class="n" id="speedN">0</div><div class="u">KM/H</div></div>
  <div id="rpmBox" class="panel"><div id="rpmLabel">RPM ×100</div><div id="rpmBar"><div id="rpmFill"></div></div></div>
  <div id="steer">
    <button id="left" class="steer" type="button" aria-label="Belok kiri">◀</button>
    <button id="right" class="steer" type="button" aria-label="Belok kanan">▶</button>
  </div>
  <div id="controls">
    <button id="brake" class="ctrl brake" type="button" aria-label="Rem"><div><div class="sym">▾</div><small>REM</small></div></button>
    <button id="gas" class="ctrl gas" type="button" aria-label="Gas"><div><div class="sym">▲</div><small>GAS</small></div></button>
    <button id="reverse" class="ctrl reverse" type="button" aria-label="Mundur"><div><div class="sym">R</div><small>MUNDUR</small></div></button>
    <button id="dump" class="ctrl dump" type="button" aria-label="Dump"><div><div class="sym">↥</div><small>DUMP</small></div></button>
    <button id="reset" class="ctrl reset" type="button" aria-label="Reset"><div><div class="sym">↻</div><small>RESET</small></div></button>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
